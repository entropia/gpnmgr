services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Use Django runserver in development so code changes reload automatically.
    # We mount the project directory into the container and run as root
    # to avoid permission issues when editing files from host.
    user: root
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - DEBUG=1
      - ALLOWED_HOSTS=*
      - PYTHONUNBUFFERED=1
      - OAUTH_SECRET=cOi1F9wqVBq8KkhIVZjoIvBjB8zLbHsx
      - OPENID_CONF_URL=http://host.docker.internal:8080/realms/gpnmgr/.well-known/openid-configuration
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app:rw
      - staticfiles:/app/src/staticfiles
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./gpnmgr-realm.json:/opt/keycloak/data/import/realm.json
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  staticfiles:
    driver: local

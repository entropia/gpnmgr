<div class="modal fade" id="inviteUserModal" tabindex="-1" aria-labelledby="inviteUserModal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" id="inviteUserModalContent">
            <form method="post" action="{% url 'user_invite' %}" id="inviteUserModalForm"
                  autocomplete="off">{% csrf_token %}
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="inviteUserModalLabel">{% trans 'Invite user' %}</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="{% trans 'Close' %}"></button>
                </div>
                <div class="modal-body row gx-3 gy-0">
                    {% bootstrap_form_errors invite_form layout='inline' type='non_fields' %}
                    <div class="col-md-12">
                        {% bootstrap_field invite_form.name %}
                    </div>
                    <div class="col-md-12">
                        {% bootstrap_field invite_form.email %}
                    </div>
                    <div class="col-md-12">
                        {% bootstrap_field invite_form.invite_text %}
                    </div>
                    <div class="col-md-12">
                        {% bootstrap_field invite_form.team %}
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">{% trans 'Close' %}</button>
                    <button type="button" id="inviteUserModalReset"
                            class="btn btn-danger">{% trans 'Reset' %}</button>
                    <button type="submit" class="btn btn-success">{% trans 'Invite user' %}</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addAccountUserModal" tabindex="-1" aria-labelledby="addAccountUserModal"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" id="addAccountUserModalContent">
            <form method="post" action="{% url 'mastodon_user_add' object.pk %}" id="addAccountUserModalForm"
                  autocomplete="off">{% csrf_token %}
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addAccountUserModalLabel">{% trans 'Add user' %}</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="{% trans 'Close' %}"></button>
                </div>
                <div class="modal-body row gx-3 gy-0">
                    {% bootstrap_form_errors user_add_form layout='inline' type='non_fields' %}

                    <div id="user-add-selected-items" class="d-flex flex-wrap gap-2 mb-2"></div>

                    <div class="col-md-12 dropdown">
                        {% bootstrap_field user_add_form.user_input %}
                        <ul id="user-add-search-results" class="dropdown-menu">

                        </ul>
                    </div>
                    {% bootstrap_field user_add_form.users %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">{% trans 'Close' %}</button>
                    <button type="button" id="addAccountUserModalReset"
                            class="btn btn-danger">{% trans 'Reset' %}</button>
                    <button type="submit" class="btn btn-info">{% trans 'Add' %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
